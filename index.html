<!-- viewport-fit=cover lets the canvas run under the iPhone notch/home bar; the
     game draws its own margins. maximum-scale/user-scalable stop pinch and
     double-tap zoom, which a canvas game never wants. -->

<style>
  html, body {
    margin: 0; padding: 0; background: #0b0a08;
    width: 100%; height: 100%;
    overflow: hidden;                 /* no page scroll, no horizontal scroll */
    overscroll-behavior: none;        /* no rubber-band on the body */
    position: fixed; inset: 0;        /* iOS: body never scrolls under the toolbar */
    -webkit-text-size-adjust: 100%;
    touch-action: none;               /* the canvas owns every gesture */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;      /* no long-press callout over the canvas */
    -webkit-tap-highlight-color: transparent;
  }
  /* 100dvh tracks the iOS Safari toolbar as it shows/hides; fall back to 100%. */
  /* Phaser's autoCenter positions the canvas inside #game with margins;
     #game itself must NOT also flex-centre it or the offset doubles. */
  #game { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; display: block; }
  canvas { image-rendering: auto; display: block; touch-action: none; }
  /* Fullscreen: the game box owns the monitor / phone display. */
  :fullscreen, :-webkit-full-screen { background: #0b0a08; width: 100%; height: 100%; }
  #game:fullscreen, #game:-webkit-full-screen {
    inset: 0; width: 100vw !important; height: 100vh !important;
    width: 100dvw !important; height: 100dvh !important;
  }

  /* DOM text fields overlaid on the canvas (canvas text can't summon a
     software keyboard). Positioned by ADV.UI.textField in game-space units. */
  .adv-field {
    position: absolute; box-sizing: border-box; z-index: 40;
    background: #211d18; color: #e8e0d0; border: 1px solid #5a4e3c; border-radius: 4px;
    font-family: Georgia, 'Times New Roman', serif; font-size: 16px; /* >=16px: iOS won't zoom */
    text-align: center; outline: none; padding: 0 8px; margin: 0;
    -webkit-user-select: text; user-select: text; touch-action: manipulation;
    pointer-events: auto;
    -webkit-appearance: none; appearance: none;
  }
  .adv-field:focus { border-color: #c8a24a; }
  .adv-field.adv-purple { color: #b48ee0; }

  /* Landscape-only: on a phone held upright, ask for a turn. Dismisses itself
     the moment the viewport is wider than it is tall. */
  #rotate {
    position: fixed; inset: 0; z-index: 100; display: none;
    background: #0b0a08; color: #d8cdb8; text-align: center;
    font-family: Georgia, serif; padding: 0 24px;
    flex-direction: column; justify-content: center; align-items: center; gap: 18px;
  }
  #rotate .icon { width: 64px; height: 112px; border: 3px solid #c8a24a; border-radius: 10px;
                  animation: advturn 1.6s ease-in-out infinite; }
  #rotate .t { font-size: 20px; color: #e7b450; letter-spacing: 1px; }
  #rotate .s { font-size: 14px; color: #8b7d6b; }
  @keyframes advturn { 0%,25% { transform: rotate(0deg); } 60%,100% { transform: rotate(90deg); } }
  body.portrait #rotate { display: flex; }

  #adv-live-update {
    display: none; position: fixed; inset: 0; z-index: 10000;
    background: rgba(11, 10, 8, 0.92); color: #e8e0d0;
    font-family: Georgia, 'Times New Roman', serif;
    flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 28px 24px;
  }
  #adv-live-update.show { display: flex; }
  #adv-live-update h1 { color: #e7b450; font-size: 26px; letter-spacing: 0.5px; margin: 0 0 18px; }
  #adv-live-update p { font-size: 16px; line-height: 1.5; max-width: 520px; margin: 0 0 28px; color: #d8cdb8; }
  #adv-live-update button {
    background: #211d18; color: #e8e0d0; border: 1px solid #c8a24a; border-radius: 4px;
    font-family: Georgia, 'Times New Roman', serif; font-size: 16px;
    padding: 12px 52px; cursor: pointer;
  }
  #adv-live-update button:focus { outline: 2px solid #c8a24a; }
</style>

<script>
window.__game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: ADV.T.W,
  height: ADV.T.H,
  backgroundColor: '#171512',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    fullscreenTarget: document.getElementById('game'),
  },
  input: { activePointers: 3 },
  scene: [ADV.TitleScene, ADV.CreationScene, ADV.TownScene, ADV.QuestScene, ADV.CombatScene, ADV.DeathScene, ADV.AnimePreviewScene, ADV.AnimeCombatScene, ADV.GatePreviewScene],
});

// ---- mobile viewport handling -------------------------------------------
// Phaser's FIT mode measures the parent once per resize event. On phones the
// viewport keeps changing AFTER that event fires: iOS Safari's toolbar slides
// away a few hundred ms after rotation, Chrome's URL bar collapses on scroll,
// and returning from the background can land on a stale size. So every trigger
// schedules a short burst of re-measures rather than a single one.
(function () {
  const game = window.__game;
  const isPhone = /Android|iPhone|iPod|Mobile/i.test(navigator.userAgent) && !/iPad/i.test(navigator.userAgent);
  let timers = [];
  function refit() {
    const el = document.getElementById('game');
    const fs = document.fullscreenElement || document.webkitFullscreenElement;
    const vv = window.visualViewport;
    const w = Math.round(fs ? window.innerWidth : (vv ? vv.width : window.innerWidth));
    const h = Math.round(fs ? window.innerHeight : (vv ? vv.height : window.innerHeight));
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    // Phaser reads canvas.style inside refresh(); before boot there is no
    // canvas yet, so wait for 'ready' (hooked below) rather than call early.
    if (game && game.scale && game.canvas) {
      game.scale.setParentSize(w, h);
      game.scale.refresh();
    }
    // Landscape-only: portrait on a phone shows the rotate prompt.
    const portrait = isPhone && h > w;
    document.body.classList.toggle('portrait', portrait);
    if (ADV.UI && ADV.UI.repositionFields) ADV.UI.repositionFields();
  }
  function burst() {
    timers.forEach(clearTimeout); timers = [];
    refit();
    [60, 200, 450, 900].forEach(ms => timers.push(setTimeout(refit, ms)));
  }
  window.addEventListener('resize', burst);
  document.addEventListener('fullscreenchange', burst);
  document.addEventListener('webkitfullscreenchange', burst);
  window.addEventListener('orientationchange', burst);
  window.addEventListener('pageshow', burst);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) burst(); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', burst);
  if (screen.orientation) screen.orientation.addEventListener('change', burst);
  game.events.once('ready', burst);
  burst();
  window.__refit = burst;   // test hook
})();
</script>
<script>
// Live update: poll the site's update.json. When the published id changes,
// show one OK card on the town/title screen and restart. A leftover Quest
// scene must not hide the card — phones were stuck that way. Sessions that
// loaded an older page without this script cannot be reached.
(function () {
  if (location.protocol === 'file:') return;
  const box = document.getElementById('adv-live-update');
  const ok = document.getElementById('adv-live-update-ok');
  if (!box || !ok) return;
  let mine = null, shown = false, pending = false;
  function on(name) {
    try {
      const g = window.__game;
      return !!(g && g.scene && typeof g.scene.isActive === 'function' && g.scene.isActive(name));
    } catch (e) { return false; }
  }
  function atHome() {
    if (on('Town') || on('Title') || on('Boot') || on('Creation')) return true;
    if (on('Quest') || on('Combat')) return false;
    return !window.__game;
  }
  function restart() {
    try {
      const game = window.__game && window.__game.registry && window.__game.registry.get('game');
      if (game && window.ADV && ADV.Save && ADV.Save.saveGame) ADV.Save.saveGame(game);
    } catch (e) {}
    const u = new URL(location.href);
    u.searchParams.set('boot', String(Date.now()));
    u.searchParams.set('cb', 'live7');
    location.replace(u.pathname + u.search + u.hash);
  }
  function show() {
    if (shown) return;
    if (!atHome()) return;
    shown = true;
    box.classList.add('show');
    try { ok.focus(); } catch (e) {}
  }
  async function pull() {
    const urls = [
      'update.json?t=' + Date.now() + '&cb=live7',
      'update-live-7.json?t=' + Date.now()
    ];
    for (let i = 0; i < urls.length; i++) {
      try {
        const r = await fetch(urls[i], { cache: 'no-store', headers: { 'Cache-Control': 'no-cache', Pragma: 'no-cache' } });
        if (!r.ok) continue;
        const data = await r.json();
        if (data && data.id) return data;
      } catch (e) {}
    }
    return null;
  }
  async function check() {
    if (shown) return;
    try {
      const data = await pull();
      if (!data) return;
      if (mine == null) { mine = data.id; return; }
      if (data.id !== mine) pending = true;
    } catch (e) {}
    if (pending) show();
  }
  ok.addEventListener('click', restart);
  window.__advLiveUpdateCheck = check;
  check();
  setInterval(check, 8000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
})();
</script>
