<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; background: #0b0a08; color: #d8cdb8; font-family: system-ui, sans-serif; }
  #bar { position: fixed; inset: 0 0 auto; min-height: 44px; display: flex; align-items: center; gap: 1rem; padding: 0 .75rem; font-size: .8rem; z-index: 5; }
  #bar a, #bar button { color: #e7b450; min-height: 44px; display: inline-flex; align-items: center; }
  #bar .sp { flex: 1; }
  #bar button { background: none; border: 0; font: inherit; cursor: pointer; }
  #bar [hidden] { display: none; }
  #game { position: fixed; top: 44px; left: 0; width: 100%; height: calc(100dvh - 44px); border: 0; background: #0b0a08; }
  body.phone #bar { display: none; }
  body.phone #game { top: 0; height: 100dvh; }
  #safe-probe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  @media (display-mode: standalone), (display-mode: fullscreen) { #bar { display: none; } #game { top: 0; height: 100dvh; } }
</style>

<body>
<div id="bar"><a href="/">← Neverending Narratives</a><span>Adventurer</span><span class="sp"></span><button id="fs" hidden>Fullscreen</button></div>
<div id="safe-probe" aria-hidden="true"></div>
<!-- Preserve the game's existing origin and save storage. -->
<iframe id="game" src="https://charlesnmcdowell.github.io/Adventure-Game/" title="Adventurer" allow="fullscreen; autoplay; clipboard-write" allowfullscreen></iframe>
<script>
  const frame = document.getElementById('game'), fullscreen = document.getElementById('fs');
  const ua = navigator.userAgent;
  const phone = /iPhone|iPod|Android.*Mobile|Windows Phone/.test(ua) || (matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) <= 600);
  const inApp = /FBAN|FBAV|Messenger|Instagram/i.test(ua);
  document.body.classList.toggle('phone', phone);
  const canFullscreen = !inApp && !/iPhone|iPod/.test(ua) && !!document.documentElement.requestFullscreen;
  fullscreen.hidden = !canFullscreen;
  fullscreen.addEventListener('click', () => { if (canFullscreen) frame.requestFullscreen().catch(() => {}); });
  function sendState() {
    const css = getComputedStyle(document.getElementById('safe-probe'));
    const safeArea = {};
    for (const side of ['top','right','bottom','left']) safeArea[side] = parseFloat(css.getPropertyValue('padding-' + side)) || 0;
    frame.contentWindow.postMessage({type:'adv:host-state', standalone:navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches, safeArea}, 'https://charlesnmcdowell.github.io');
  }
  let timer;
  function schedule() { clearTimeout(timer); timer = setTimeout(sendState, 150); }
  frame.addEventListener('load', sendState);
  window.addEventListener('resize', schedule);
  window.addEventListener('pageshow', schedule);
  window.visualViewport?.addEventListener('resize', schedule);
  document.addEventListener('visibilitychange', schedule);
  matchMedia('(orientation: landscape)').addEventListener('change', schedule);
</script>
</body>
